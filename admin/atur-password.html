<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Atur Password Baru | Admin Rumah Adat Minang</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <img class="auth-logo" src="../assets/img/Logo.jpeg" alt="Logo Rumah Adat Minang">
      <h1>Password Baru</h1>
      <p class="sub" id="sub">Memeriksa tautan pemulihan...</p>
      <form id="new-form" novalidate style="display:none">
        <label for="pw1">Password baru</label>
        <div class="pw-row">
          <input id="pw1" type="password" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Tampilkan atau sembunyikan password">Lihat</button>
        </div>
        <p class="hint">Minimal 8 karakter, mengandung huruf dan angka.</p>
        <label for="pw2">Ulangi password baru</label>
        <input id="pw2" type="password" autocomplete="new-password" required>
        <button class="btn btn-primary" id="submit" type="submit">Simpan password</button>
      </form>
      <div id="msg" class="msg" role="alert"></div>
      <div class="links"><a href="login.html">Kembali ke halaman masuk</a><a href="lupa-password.html">Kirim tautan baru</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script>
    const msg = document.getElementById("msg"), form = document.getElementById("new-form"), sub = document.getElementById("sub");
    const hash = location.hash || "";
    const linkHasError = /error=/.test(hash);
    const linkIsRecovery = /type=recovery/.test(hash);
    let shown = false;

    function showForm() {
      if (shown) return; shown = true;
      sub.textContent = "Buat password baru untuk akun admin Anda.";
      form.style.display = "block";
    }
    function showInvalid() {
      if (shown) return;
      sub.textContent = "";
      AdminUI.formMessage(msg, "Tautan tidak valid atau sudah kedaluwarsa. Minta tautan pemulihan yang baru.", "bad");
    }

    if (!window.dbReady) { sub.textContent = ""; AdminUI.formMessage(msg, window.dbError || "Koneksi belum siap.", "bad"); }
    else if (linkHasError) { showInvalid(); }
    else {
      window.db.auth.onAuthStateChange((evt) => { if (evt === "PASSWORD_RECOVERY") showForm(); });
      setTimeout(async () => {
        const { data } = await window.db.auth.getSession();
        if (data.session && linkIsRecovery) showForm(); else showInvalid();
      }, 2500);
    }

    document.getElementById("pw-toggle").addEventListener("click", function () {
      const f = document.getElementById("pw1");
      const show = f.type === "password";
      f.type = show ? "text" : "password";
      document.getElementById("pw2").type = f.type;
      this.textContent = show ? "Sembunyi" : "Lihat";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("submit");
      AdminUI.formMessage(msg, "");
      AdminUI.setBusy(btn, true, "Menyimpan...");
      const res = await AdminAuth.updatePassword(document.getElementById("pw1").value, document.getElementById("pw2").value);
      if (res.ok) { window.location.replace("login.html?alasan=password-diubah"); return; }
      AdminUI.setBusy(btn, false);
      AdminUI.formMessage(msg, res.message, "bad");
    });
  </script>
</body>
</html>
