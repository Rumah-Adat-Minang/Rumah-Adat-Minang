<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lupa Password | Admin Rumah Adat Minang</title>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <img class="auth-logo" src="../assets/img/Logo.jpeg" alt="Logo Rumah Adat Minang">
      <h1>Lupa Password</h1>
      <p class="sub">Kami kirim tautan untuk membuat password baru ke email admin.</p>
      <form id="reset-form" novalidate>
        <label for="email">Email admin</label>
        <input id="email" type="email" autocomplete="email" required>
        <button class="btn btn-primary" id="submit" type="submit">Kirim tautan pemulihan</button>
        <div id="msg" class="msg" role="alert"></div>
      </form>
      <div class="links"><a href="login.html">Kembali ke halaman masuk</a></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/admin-ui.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script>
    const msg = document.getElementById("msg");
    document.getElementById("reset-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = document.getElementById("submit");
      AdminUI.formMessage(msg, "");
      AdminUI.setBusy(btn, true, "Mengirim...");
      const res = await AdminAuth.sendReset(document.getElementById("email").value);
      AdminUI.setBusy(btn, false);
      AdminUI.formMessage(msg, res.message, res.ok ? "ok" : "bad");
    });
  </script>
</body>
</html>
